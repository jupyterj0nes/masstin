[package]
name = "masstin"
version = "1.3.0"
edition = "2021"
description = "Lateral movement tracker for anything! A DFIR tool that parses forensic artifacts and visualizes lateral movement in graph databases. Written by Toño Díaz (@jupyterjones)"
authors = ["Tono Diaz (@jupyterj0nes)"]
repository = "https://github.com/jupyterjones/masstin"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.0.32", features = ["derive"] }
evtx = "0.11.2"
chrono = "0.4.23"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
walkdir = "2.3.2"
neo4rs = "0.6.0"
futures = "0.3.28"
tokio = { version = "1.28", features = ["macros"] }
rpassword = "7.2.0"
csv = "1.2.1"
indicatif = "0.17.3"
console = "0.15"
zip = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
flate2 = "1.0"
once_cell = "1"
regex = "1"
ewf = "0.2"
ntfs = "0.4"
vshadow = "0.2"
libesedb = "0.2"
ext4-view = { version = "0.9", features = ["std"] }
lvm2 = "0.0.3"
# notatin declares nom ">= 6" but only builds with nom 7: Cargo.lock pins
# it to 7.1.3. Build with --locked; if a `cargo update` moves notatin to
# nom 8, set its entry in Cargo.lock back to "nom 7.1.3".
notatin = "1.0"
serde_yaml_ng = "0.10"
ipnet = "2"
systemd-journal-reader = "0.1.1"
tar = "0.4"
chrono-tz = "0.10"
macos-unifiedlogs = "0.7"

