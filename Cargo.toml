[package]
name = "masstin"
version = "1.4.4"
edition = "2021"
description = "Lateral movement tracker for anything! A DFIR tool that parses forensic artifacts and visualizes lateral movement in graph databases. Written by Toño Díaz (@jupyterjones)"
authors = ["Tono Diaz (@jupyterj0nes)"]
repository = "https://github.com/jupyterjones/masstin"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.0.32", features = ["derive"] }
evtx = "0.11.2"
rayon = "1"
chrono = "0.4.23"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
walkdir = "2.3.2"
neo4rs = "0.6.0"
futures = "0.3.28"
tokio = { version = "1.28", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
rpassword = "7.2.0"
csv = "1.2.1"
indicatif = "0.17.3"
console = "0.15"
zip = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
flate2 = "1.0"
once_cell = "1"
regex = "1"
blockcarve = { version = "0.1.2", default-features = false }
ewf = "0.2"
ntfs = "0.4"
vshadow = "0.2"
libesedb = "0.2"
ext4-view = { version = "0.9", features = ["std"] }
lvm2 = "0.0.3"
rust-fs-xfs = { version = "0.14", default-features = false }
rust-fs-core = { version = "0.3", default-features = false }
nt_hive2 = "4"
serde_yaml_ng = "0.10"
ipnet = "2"
systemd-journal-reader = "0.1.1"
tar = "0.4"
chrono-tz = "0.10"
macos-unifiedlogs = "0.7"
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# the window drawn without a GPU (src/view/softwin.rs): the same winit and egui-winit eframe uses
egui-winit = { version = "0.37", optional = true, default-features = false }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
egui = { version = "0.37", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "gif"] }
gif = { version = "0.14", optional = true }
color_quant = { version = "1.1", optional = true }
rfd = { version = "0.17", optional = true }
strength_reduce = { version = "0.2.4", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# the built-in graph viewer (`-a view`, a native window); off for a parser-only binary
default = ["ui"]
ui = ["dep:eframe", "dep:egui", "dep:image", "dep:gif", "dep:color_quant", "dep:rfd", "dep:strength_reduce", "dep:egui-winit", "dep:winit", "dep:softbuffer"]
