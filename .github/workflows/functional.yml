name: Functional (real data, three OSes)

# Parses two public EVTX sample sets and a public OpenSSH log (intact and
# as a truncated .gz), and runs the hunt on the result, on
# Linux, Windows and macOS (Apple Silicon natively, and the Intel binary
# under Rosetta on the same runner), then checks that every OS produced
# the same timeline byte for byte once the artifact paths are normalised.
# This is the test the unit tests cannot give: the whole pipeline on real
# event logs, on the platforms the release ships for.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'resources/**'
      - 'neo4j-resources/**'
      - 'memgraph-resources/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, catches toolchain drift between pushes

permissions:
  contents: read

env:
  MITRE_REPO: https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack
  SAMPLES_REPO: https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
  LOGHUB_SSH: https://raw.githubusercontent.com/logpai/loghub/master/OpenSSH/OpenSSH_2k.log

jobs:
  run:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build (native)
        run: cargo build --release --locked

      - name: Build (x86_64, macOS only)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Cache the sample sets
        id: samples
        uses: actions/cache@v4
        with:
          path: samples
          key: evtx-samples-v1

      - name: Fetch the sample sets
        if: steps.samples.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p samples
          git clone -q --depth 1 "$MITRE_REPO" samples/EVTX-to-MITRE-Attack
          git clone -q --depth 1 "$SAMPLES_REPO" samples/EVTX-ATTACK-SAMPLES
          rm -rf samples/*/.git

      - name: Parse and hunt (native binary)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/masstin
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/masstin.exe
          mkdir -p out
          "$BIN" -a parse-windows -d samples/EVTX-to-MITRE-Attack -o out/mitre.csv --overwrite
          "$BIN" -a parse-windows -d samples/EVTX-ATTACK-SAMPLES -o out/samples.csv --overwrite
          "$BIN" -a graph-hunt-csv -f out/mitre.csv --investigation-from "2021-01-01 00:00:00" -o out/hunt.csv --report out/hunt.md --overwrite
          python3 .github/scripts/normalize_timeline.py out/mitre.csv EVTX-to-MITRE-Attack | tee -a out/hashes.txt
          python3 .github/scripts/normalize_timeline.py out/samples.csv EVTX-ATTACK-SAMPLES | tee -a out/hashes.txt
          echo "hunt rows: $(wc -l < out/hunt.csv)" | tee -a out/hashes.txt

      - name: parse-mac on a log show export (all three OSes)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/masstin
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/masstin.exe
          mkdir -p out
          cat > out/logshow.ndjson <<'JSON'
          {"timestamp":"2026-03-15 09:12:30.250000+0200","processImagePath":"/usr/sbin/sshd","eventMessage":"Accepted publickey for alice from 10.0.0.5 port 50022 ssh2: ED25519 SHA256:abc"}
          {"timestamp":"2026-03-15 09:15:00.000000+0200","processImagePath":"/usr/sbin/sshd","eventMessage":"Failed password for invalid user root from 203.0.113.7 port 40510 ssh2"}
          {"timestamp":"2026-03-15 09:20:45.900000+0200","process":"screensharingd","eventMessage":"Authentication: SUCCEEDED :: User Name: deanwinchester :: Viewer Address: 192.168.1.10 :: Type: DH"}
          {"timestamp":"2026-03-15 09:21:00.000000+0200","process":"screensharingd","eventMessage":"Authentication: FAILED :: User Name: guest :: Viewer Address: 192.168.1.99 :: Type: DH"}
          {"timestamp":"2026-03-15 09:40:00.000000+0200","processImagePath":"/usr/sbin/sshd","eventMessage":"Disconnected from user alice 10.0.0.5 port 50022"}
          {"timestamp":"2026-03-15 09:00:00.000000+0200","processImagePath":"/usr/sbin/sshd","eventMessage":"Server listening on 0.0.0.0 port 22."}
          {"timestamp":"2026-03-15 10:00:00.000000+0200","process":"loginwindow","eventMessage":"USER_PROCESS: console login"}
          {"timestamp":"2026-03-15 10:05:00.000000+0200","process":"sudo","eventMessage":"alice : TTY=ttys000 ; PWD=/ ; USER=root ; COMMAND=/bin/ls"}
          JSON
          "$BIN" -a parse-mac -f out/logshow.ndjson -o out/mac.csv --overwrite
          n=$(( $(wc -l < out/mac.csv) - 1 ))
          echo "parse-mac rows: $n" | tee -a out/hashes.txt
          # Five lateral-movement rows; the three noise lines (listening, console
          # login, sudo) must be dropped.
          [ "$n" -eq 5 ] || { echo "::error::parse-mac expected 5 rows, got $n"; exit 1; }
          grep -q MAC-SCREENSHARE-OK out/mac.csv || { echo "::error::screensharingd success not classified"; exit 1; }
          grep -q MAC-SSHD-OK out/mac.csv || { echo "::error::sshd success not classified"; exit 1; }
          ! grep -q loginwindow out/mac.csv || { echo "::error::console login was not dropped"; exit 1; }

      - name: parse-linux on a public OpenSSH log, intact and truncated (all three OSes)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/masstin
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/masstin.exe
          # loghub OpenSSH_2k (a real sshd log, host LabSZ, December 2015), laid
          # out as a collected tree; the logrotate suffix fixes the year, so
          # every runner dates the RFC3164 lines the same way
          mkdir -p linux/LabSZ/var/log linux/LabSZ/etc linux-damaged/var/log
          echo LabSZ > linux/LabSZ/etc/hostname
          curl -fsSL "$LOGHUB_SSH" -o linux/LabSZ/var/log/secure-20160101
          "$BIN" -a parse-linux -d linux/LabSZ -o out/linux.csv --overwrite
          python3 .github/scripts/normalize_timeline.py out/linux.csv LabSZ | tee -a out/hashes.txt
          n=$(( $(wc -l < out/linux.csv) - 1 ))
          [ "$n" -gt 1000 ] || { echo "::error::parse-linux expected over 1000 rows from OpenSSH_2k, got $n"; exit 1; }
          grep -q SSH_SUCCESS out/linux.csv || { echo "::error::no SSH_SUCCESS row"; exit 1; }
          # the same log as a rotated .gz cut in half (a copy interrupted in
          # triage): must end with a warning and the rows before the cut,
          # never spin
          gzip -c linux/LabSZ/var/log/secure-20160101 > full.gz
          head -c $(( $(wc -c < full.gz) / 2 )) full.gz > linux-damaged/var/log/secure-20160101.gz
          rm full.gz
          python3 - "$BIN" <<'PY'
          import os, subprocess, sys
          try:
              p = subprocess.run([os.path.abspath(sys.argv[1]), '-a', 'parse-linux', '-d', 'linux-damaged', '-o', 'out/linux-damaged.csv', '--overwrite'],
                                 capture_output=True, text=True, timeout=120)
          except subprocess.TimeoutExpired:
              print('::error::parse-linux hung on a truncated .gz'); sys.exit(1)
          out = p.stdout + p.stderr
          rows = sum(1 for _ in open('out/linux-damaged.csv', encoding='utf-8')) - 1
          print(f'truncated .gz: exit {p.returncode}, {rows} rows')
          if 'read stopped' not in out:
              print('::error::no warning for the truncated .gz'); sys.exit(1)
          if rows <= 0:
              print('::error::no rows recovered before the cut'); sys.exit(1)
          PY

      - name: Build NTFS disk images from the samples and parse them (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .github/scripts/build-ntfs-image.ps1 -Samples samples/EVTX-to-MITRE-Attack -Out out/evtx-samples.raw -Format raw
          .github/scripts/build-ntfs-image.ps1 -Samples samples/EVTX-to-MITRE-Attack -Out out/evtx-samples.vhd -Format vhd -Type expandable
          .github/scripts/build-ntfs-image.ps1 -Samples samples/EVTX-to-MITRE-Attack -Out out/evtx-samples.vhdx -Format vhdx -Type expandable
          target/release/masstin.exe -a parse-image -f out/evtx-samples.raw -o out/image.csv --overwrite
          target/release/masstin.exe -a parse-image -f out/evtx-samples.vhd -o out/vhd.csv --overwrite
          target/release/masstin.exe -a parse-image -f out/evtx-samples.vhdx -o out/vhdx.csv --overwrite
          python .github/scripts/normalize_timeline.py out/image.csv evtx-samples.raw | Tee-Object -Append out/hashes.txt
          python .github/scripts/normalize_timeline.py out/vhd.csv evtx-samples.vhd | Tee-Object -Append out/hashes.txt
          python .github/scripts/normalize_timeline.py out/vhdx.csv evtx-samples.vhdx | Tee-Object -Append out/hashes.txt

      - name: Upload the disk images for the other operating systems
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-image
          path: |
            out/evtx-samples.raw
            out/evtx-samples.vhd
          retention-days: 3

      - name: Custom-parser rule library on its sample lines (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for rule in rules/*/*.yaml; do
            dir=$(dirname "$rule"); name=$(basename "$rule" .yaml)
            sample="$dir/samples/$name.sample.log"
            [ -f "$sample" ] || { echo "::warning::$rule has no sample"; continue; }
            target/release/masstin -a parse-custom --rules "$rule" -f "$sample" -o "out/rule-$name.csv" --overwrite --silent >/dev/null 2>&1 || true
            n=$(( $(wc -l < "out/rule-$name.csv" 2>/dev/null || echo 1) - 1 ))
            echo "$rule: $n row(s) from $(wc -l < "$sample") sample line(s)"
            [ "$n" -gt 0 ] || { echo "::error::$rule produced no rows from its sample"; fail=1; }
          done
          [ $fail -eq 0 ]

      - name: Parse with the Intel binary under Rosetta (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/x86_64-apple-darwin/release/masstin
          file "$BIN"
          "$BIN" -a parse-windows -d samples/EVTX-to-MITRE-Attack -o out/mitre-x86_64.csv --overwrite
          python3 .github/scripts/normalize_timeline.py out/mitre-x86_64.csv EVTX-to-MITRE-Attack | tee -a out/hashes.txt
          cmp out/mitre.csv.norm out/mitre-x86_64.csv.norm && echo "Intel and Apple Silicon binaries agree"

      - name: Upload normalised timelines
        uses: actions/upload-artifact@v4
        with:
          name: timelines-${{ matrix.os }}
          path: |
            out/*.norm
            out/hashes.txt
            out/hunt.md

  image:
    name: parse-image on ${{ matrix.os }}
    needs: run
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Download the NTFS image built on Windows
        uses: actions/download-artifact@v4
        with:
          name: ntfs-image
          path: img
      - name: Parse the image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          target/release/masstin -a parse-image -f img/evtx-samples.raw -o out/image.csv --overwrite
          target/release/masstin -a parse-image -f img/evtx-samples.vhd -o out/vhd.csv --overwrite
          python3 .github/scripts/normalize_timeline.py out/image.csv evtx-samples.raw | tee out/hashes.txt
          python3 .github/scripts/normalize_timeline.py out/vhd.csv evtx-samples.vhd | tee -a out/hashes.txt
      - name: Upload normalised timeline
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.os }}
          path: |
            out/image.csv.norm
            out/vhd.csv.norm
            out/hashes.txt

  compare:
    name: Same output on every OS
    needs: [run, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all

      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          for f in mitre.csv.norm samples.csv.norm linux.csv.norm image.csv.norm vhd.csv.norm; do
            echo "== $f"
            sha256sum all/*/"$f"
            n=$(sha256sum all/*/"$f" | awk '{print $1}' | sort -u | wc -l)
            [ "$n" -eq 1 ] || { echo "::error::$f differs between operating systems"; exit 1; }
          done
          # the disk image must yield exactly the loose-file timeline
          # (same events, same order; only the log_filename column differs)
          python3 - <<'PY'
          import csv, glob, sys
          def rows(p):
              with open(p, encoding='utf-8', newline='') as f:
                  r = list(csv.reader(f))
              i = r[0].index('log_filename')
              return [tuple(x[:i] + x[i+1:]) for x in r[1:]]
          a = rows(glob.glob('all/timelines-ubuntu-latest/mitre.csv.norm')[0])
          for name, pat in [('raw image', 'all/image-ubuntu-latest/image.csv.norm'), ('dynamic VHD', 'all/image-ubuntu-latest/vhd.csv.norm'), ('dynamic VHDX', 'all/timelines-windows-latest/vhdx.csv.norm')]:
              b = rows(glob.glob(pat)[0])
              print(f'loose files: {len(a)} rows; {name}: {len(b)} rows')
              if a != b:
                  print(f'::error::parse-image on the {name} and parse-windows disagree on the same EVTX set'); sys.exit(1)
          PY
          cat all/*/hashes.txt
          echo "All three operating systems produced the same timelines."
